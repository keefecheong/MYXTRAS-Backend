name: test

on:
  push:
    branches: [ main, polish ]

jobs:
  testing:
    name: Testing
    runs-on: ubuntu-latest
    steps:
      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm ci
      
      - name: Build docker image
        run: docker run -d -v "$(pwd)/cache/redis.conf:/redis-stack.conf" -p 6379:6379 redis/redis-stack:latest

      - name: Integration tests
        run: npm run test:integration
